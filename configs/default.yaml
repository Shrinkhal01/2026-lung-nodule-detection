# One place for every path and setting. Strings may use $SCRATCH (expanded at load time).
paths:
  scratch: $SCRATCH
  raw: $SCRATCH/lidc_raw             # idc-index download root
  lidc_dicom: $SCRATCH/lidc_raw/lidc_idri   # pylidc looks for <this>/LIDC-IDRI-XXXX/...
  cache: $SCRATCH/cache_lungdet      # Phase 1: HU, 1 mm, lung mask per scan
  candidates: $SCRATCH/candidates    # Phase 2-3: candidates.csv + 32 mm cubes
  checkpoints: $SCRATCH/checkpoints  # Phase 3: .pth files (never in git)
  patches: $SCRATCH/patches          # Phase 3: 32 mm cubes (train sample, all val/test candidates)
  # Server scripts write OUTSIDE the git clone, so 'git pull' on the server never collides with results.
  # tools/pull_results.sh copies them into the repo's results/ on the Mac, where they are committed.
  results: $SCRATCH/lungdet_results
  tables: $SCRATCH/lungdet_results/phase1   # scans.csv, nodules.csv, reports, QC pictures

ground_truth:                        # LUNA16 rule
  max_slice_thickness_mm: 2.5
  min_readers: 3                     # of 4
  min_diameter_mm: 3.0

isolate:
  spacing_mm: 1.0
  clip_hu: [-1000, 1000]             # removes the -2048 padding; calcified nodules stay visible
  lung_threshold_hu: -320            # starting value, checked in Phase 1
  closing_radius_mm: 15              # chosen by scripts/03b_mask_sweep.py on TRAIN scans (10 -> 91.4%, 15 -> 98.0%, 20 -> 98.7% inside)
  keep_ratio: 0.1                    # 2nd blob kept only if >= 10% of the biggest
  crop_margin_mm: 10
  workers: 32

nominate:                            # LoG blob detector (BLOB); diameter found ~ 3.5 x sigma
  sigmas_mm: [1.0, 1.5, 2.5, 4.0, 6.0, 9.0, 13.0]   # ~3.5 to ~45 mm (largest GT nodule: 46.8 mm)
  min_hu: -700                       # a peak must not be air
  floor: 30                          # lowest blob response stored before the sweep
  max_per_scan: 30000                # storage cap per scan (the 3,000 cap cost 56 of 59 missed TRAIN nodules)
  recall_target: 0.95                # selection = fewest candidates reaching this TRAIN recall
  sweep_global_top: [1000, 2000, 3000, 5000, 8000, 12000, 20000, 30000]   # keep the N strongest per scan
  sweep_per_scale_top: [100, 200, 300, 500, 800, 1200, 2000, 3000]       # keep the q strongest PER SIZE per scan
  workers: 64

discard:
  cube_mm: 32
  seeds: [42, 43, 44, 45, 46]
  neg_random_per_scan: 150           # random false candidates per TRAIN scan
  neg_hard_per_scan: 50              # strongest-blob false candidates per TRAIN scan (used by R3 only)
  gt_jitter: 4                       # extra positives per GT nodule, centre shifted by up to jitter_mm
  jitter_mm: 2
  epochs: 10
  steps_per_epoch: 200
  batch: 512
  lr: 0.001
  pos_frac: 0.25                     # share of positives in every batch (balanced sampling)

split:
  fractions: [0.70, 0.15, 0.15]      # train / val / test, by PATIENT
  seed: 42

hush:                                # Phase 3b (HUSH)
  hessian_sigmas_mm: [1.0, 2.0, 4.0] # H: curvature measured at 3 sizes
  pretrain_per_scan: 500             # U: unlabelled TRAIN cubes per scan (~314k)
  pretrain_steps: 6000
  pretrain_batch: 256
  mask_ratio: 0.6                    # U: share of 4^3 blocks hidden
  mask_block: 4
  size_weight: 0.1                   # S: weight of the size loss
  max_gpu_gb: 40                     # memory cap per process on the shared GPUs
  infer_batch: 1024

gpus: "1,2"                          # use 2 of the 4 shared GPUs (fair use); GPU 0 stays free for others

ship:                                # Phase 5 (S): predict.py + Gradio demo
  model_rung: r5                     # HUSH ensemble = the model that was opened on TEST (final_choice.json)
  seeds: [42, 43, 44, 45, 46]
  per_size_top: 1200                 # Phase 2 choice (results/phase2/nominate_choice.json): per-size top-1200
  default_fp_per_scan: 1             # operating point used when --fp-per-scan is not given
  merge_min_mm: 3.0                  # detections closer than max(this, sqrt(3)*sigma) become ONE finding (NOT part of the TEST numbers)
  cpu_batch: 64                      # cubes per forward pass on CPU (8 GB Mac); GPUs use hush.infer_batch
  operating_points: results/phase5/operating_points.json   # thresholds picked on VAL by scripts/12_operating_points.py
